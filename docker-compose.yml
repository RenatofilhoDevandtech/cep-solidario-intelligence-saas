services:
  # 1. Frontend Web (React + Vite + Tailwind CSS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cep_solidario_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cep_network

  # 2. Backend API (Node.js + Express + Fallback ViaCEP/BrasilAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cep_solidario_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-cepsolidario}
      - DB_PASSWORD=${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      - DB_NAME=${MYSQL_DATABASE:-cepsolidario_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cep_network

  # 3. Banco de Dados Relacional (MySQL 8)
  db:
    image: mysql:8.0
    container_name: cep_solidario_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cepsolidario_db}
      - MYSQL_USER=${MYSQL_USER:-cepsolidario}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cep_network

  # 4. Cache & Rate Limiting (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: cep_solidario_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - cep_network

networks:
  cep_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
